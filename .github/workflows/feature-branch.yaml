on:
  push:
    branches:
      - 'feature/**'

jobs:
  call-reusable:
    permissions:
      security-events: write # Required to view code scanning results
      actions: read
      contents: read         # Standard permission to checkout code
    uses: akshaypgore/ci-cd-workflows/.github/workflows/feature-branch.yaml@master
    secrets: inherit
    with:
      branch: ${{ github.ref_name }}
      repo: ${{ github.event.repository.name }}
      dockerhub_repo: "akshaygore"