name: ci

on:
  push:    

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Check out repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - 
        name: Read version from file
        id: get_version
        run: |
          echo "current_version=$(cat version.txt)" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$(git show master:version.txt)" >> "$GITHUB_OUTPUT"
      -
        name: Print versions
        run: |
          echo "current-app-version: ${{ steps.get_version.outputs.current_version }}"
          echo "new-app-version: ${{ steps.get_version.outputs.upstream_version }}"
      -
        name: Compare versions
        run: |
          is_greater() {
              local ver1=$1
              local ver2=$2
              if [ "$(printf '%s\n' "$ver1" "$ver2" | sort -V | head -n1)" = "$ver2" ] && [ "$ver1" != "$ver2" ]; then
                  # This condition is met if ver2 is smaller, meaning ver1 is greater
                  return 0
              else
                  # This condition is met if ver1 is smaller or equal to ver2
                  return 1
              fi
          }

          # Call the function and act on the result
          if is_greater "${{ steps.get_version.outputs.current_version }}" "${{ steps.get_version.outputs.upstream_version }}" ; then
              echo "Success: Current version is greater than the required minimum."
              # Proceed with your application logic here
          else
              echo "Failure: Current version is less than or same as the required minimum. Exiting."
              # Exit the script with a failure status
              exit 1
          fi
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: akshaygore/web-app:test
      - name: Test
        run: |
          docker run --rm akshaygore/web-app:test nginx -t
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: akshaygore/web-app:${{ steps.get_version.outputs.current_version }}