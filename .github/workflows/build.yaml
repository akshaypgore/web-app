name: ci

on:
  push:    

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Check out repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - 
        name: Read version from file
        id: get_version
        run: |
          echo "current_version=$(cat version.txt)" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$(git show HEAD~1:version.txt)" >> "$GITHUB_OUTPUT"
      -
        name: Print versions
        run: |
          echo "${{ steps.get_version.outputs.current_version }}"
          echo "${{ steps.get_version.outputs.upstream_version }}"
